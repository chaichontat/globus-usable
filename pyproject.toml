[project]
name = "globus-usable"
version = "0.1.0"
description = "A usable Globus CLI wrapper with rsync-like semantics"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "globus-cli>=3.0.0",
    "questionary>=2.0.0",
    "rich-click>=1.8.0",
    "rich>=13.0.0",
    "tomli>=2.0.0; python_version<'3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
globus-usable = "globus_usable:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/globus_usable"]

[tool.pytest.ini_options]
pythonpath = ["src"]
